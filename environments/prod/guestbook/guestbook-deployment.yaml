apiVersion: apps/v1
kind: Deployment

metadata:
  name: guestbook
  namespace: guestbook

spec:
  replicas: 3

  selector:
    matchLabels:
      app: guestbook

  template:
    metadata:
      labels:
        app: guestbook

    spec:
      containers:
        - name: guestbook
          image: nginx:stable

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
