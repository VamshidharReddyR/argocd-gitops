apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: guestbook-project
  namespace: argocd

spec:
  description: Guestbook GitOps Project

  sourceRepos:
    - '*'

  destinations:
    - namespace: guestbook
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
