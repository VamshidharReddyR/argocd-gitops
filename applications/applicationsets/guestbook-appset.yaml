apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: guestbook-appset
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - environment: dev
          - environment: prod

  template:
    metadata:
      name: 'guestbook-{{environment}}'

    spec:
      project: guestbook-project

      source:
        repoURL: https://github.com/example/guestbook-app.git
        targetRevision: HEAD
        path: .

      destination:
        server: https://kubernetes.default.svc
        namespace: guestbook

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
